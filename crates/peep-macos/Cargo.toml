[package]
name = "peep-macos"
version.workspace = true
edition.workspace = true

[dependencies]
peep-core = { path = "../peep-core" }
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
anyhow = "1"
scriptrs = { version = "=0.5.0", default-features = false, features = ["long-form"] }
cpal = "0.18"
rubato = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3"
directories = "6"
global-hotkey = "0.10"
tray-icon = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-av-foundation = "0.3"
objc2-core-audio = "0.3"
block2 = "0.6"

tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan"] }

[dev-dependencies]
hound = "3.5"
