name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libudev-dev libx11-xcb-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev dbus-x11 at-spi2-core libatk-adaptor python3-gi gir1.2-gtk-3.0 xvfb openbox sway wtype
      - name: Configure Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK shader compiler is missing' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Wayland portal and accessibility protocols
        if: runner.os == 'Linux'
        run: dbus-run-session -- env PEEP_REQUIRE_DBUS_TESTS=1 cargo test -p peep-input --features linux-integration --locked --test linux_bus --test portal_bus
      - name: Test native X11 text delivery
        if: runner.os == 'Linux'
        run: ./script/test_linux_desktop.sh x11
      - name: Test native Wayland text delivery
        if: runner.os == 'Linux'
        run: ./script/test_linux_desktop.sh wayland
      - name: Test native Windows text delivery
        if: runner.os == 'Windows'
        env:
          PEEP_TEST_WINDOWS_UI: '1'
        run: cargo test -p peep-input --locked --test windows_editor -- --nocapture
      - name: Test ONNX inference with public speech fixture
        if: runner.os != 'macOS'
        run: python script/test_inference.py --backend onnx
      - name: Test Core ML inference with public speech fixture
        if: runner.os == 'macOS'
        run: python script/test_inference.py --backend coreml
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ./script/package_release.sh
      - name: Package desktop app
        if: runner.os != 'macOS'
        run: python script/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Peep-${{ runner.os }}-${{ runner.arch }}
          path: .build/release/*
