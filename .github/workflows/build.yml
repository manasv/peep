name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: ./script/setup_linux.sh
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
      - name: Rebuild Linux inference libraries
        if: runner.os == 'Linux'
        run: |
          cargo clean --package sherpa-rs-sys
          cargo clean --package sherpa-rs-sys --release
      - name: Check formatting
        if: runner.os == 'macOS'
        run: cargo fmt --all -- --check
      - name: Test
        if: runner.os == 'macOS'
        run: cargo test --workspace --locked
      - name: Lint
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Linux CI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .build/ci
          ./script/ci_linux.sh full 2>&1 | tee .build/ci/linux.log
      - name: Upload Linux CI log
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Peep-Linux-CI-log
          path: .build/ci/linux.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Run Windows CI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build/ci | Out-Null
          ./script/ci_windows.ps1 full *>&1 | Tee-Object -FilePath .build/ci/windows.log
      - name: Upload Windows CI log
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Peep-Windows-CI-log
          path: .build/ci/windows.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Test Core ML inference with public speech fixture
        if: runner.os == 'macOS'
        run: python script/test_inference.py --backend coreml
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ./script/package_release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Peep-${{ runner.os }}-${{ runner.arch }}
          path: |
            .build/release/Peep-*.zip
            .build/release/Peep-*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
