[workspace]
members = ["crates/peep-core", "crates/peep-macos"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.scriptrs]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
