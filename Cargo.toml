[workspace]
members = ["crates/peep-core", "crates/peep", "crates/peep-macos", "crates/peep-runtime", "crates/peep-desktop", "crates/peep-input"]
exclude = ["vendor/xattr"]
resolver = "2"

[patch.crates-io]
# GPUI's archive dependency needs Linux's ENODATA with current libc.
xattr = { path = "vendor/xattr" }

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.scriptrs]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
